services:
  - type: pserv
    name: streampack-tiktok-signer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    # Un servicio `pserv` (privado) no admite `healthCheckPath` en el Blueprint de
    # Render — lo rechaza al validar ("pserv service type cannot have a health check
    # path"). Render igual controla que el proceso esté vivo por su cuenta; el
    # `/healthz` más completo de este servicio sigue estando disponible para quien
    # quiera pegarle a mano (por la Shell de Render, o desde el gateway que lo consume).
    envVars:
      - key: PORT
        value: 8080
      - key: PROXY_ENABLED
        value: "false"
      # Set these two only if TikTok starts blocking Render's shared outbound IPs —
      # see the plan's §"Escala" for why this isn't turned on from day one.
      - key: PROXY_HOST
        sync: false
      - key: PROXY_USER
        sync: false
      - key: PROXY_PASS
        sync: false
